name: Python CI

on:
  push:
    branches: [ "main" ]

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run pylint
      run: pylint app.py